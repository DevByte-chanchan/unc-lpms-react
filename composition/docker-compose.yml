# LPMS composition-branch-v2 — local development stack.
#
# Replaces the MySQL-era compose files that were carried over from the
# monorepo: this worktree runs exactly two processes, and its database is a
# single SQLite file, so there is no database service to start here.
#
# Host ports sit alongside the Portfolio and Watch Party stacks:
#   backend  http://localhost:5001  -> container 5000
#   frontend http://localhost:5174  -> container 5173
#
#   docker compose up --build
#       Production build of the frontend, served by `vite preview`.
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#       Vite dev server with hot reload, same ports. See docker-compose.dev.yml.
#
# Every port and URL is overridable from the environment; see the .env.example
# next to this file for the full list.

name: lpms-composition

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: lpms-composition-server
    container_name: lpms-composition-server
    restart: unless-stopped
    environment:
      # Deliberately not "production". authController refuses the published
      # demo password (demo1234) whenever NODE_ENV is "production", and every
      # account in this worktree is a demo account, so production mode would
      # leave the app with no way to sign in. Development mode is also what
      # lets server.js accept the loopback origin the browser sends.
      # Set LPMS_NODE_ENV=production only for a deployment with real accounts.
      NODE_ENV: "${LPMS_NODE_ENV:-development}"
      # The sign-in screen lists the demo accounts (email + shared password). Never in production.
      LPMS_SHOW_DEMO_ACCOUNTS: "${LPMS_SHOW_DEMO_ACCOUNTS:-1}"
      # An empty database (a fresh clone) is filled with the demo data on first start. Never in
      # production, and never over a database that already has data.
      LPMS_AUTO_SEED_DEMO: "${LPMS_AUTO_SEED_DEMO:-1}"
      # Session cookie "Secure" flag (true / false / empty = automatic: Secure in production or over
      # https, not over plain http) and how many reverse proxies stand in front of the API (empty = none).
      LPMS_COOKIE_SECURE: "${LPMS_COOKIE_SECURE:-}"
      LPMS_TRUST_PROXY: "${LPMS_TRUST_PROXY:-}"
      # Data Protection Officer shown on the Privacy Notice page (/privacy). Empty = "not set up yet".
      LPMS_DPO_NAME: "${LPMS_DPO_NAME:-}"
      LPMS_DPO_EMAIL: "${LPMS_DPO_EMAIL:-}"
      PORT: "5000"
      # Stated explicitly so the API is told to accept the origin the browser
      # actually loads the app from, whatever NODE_ENV ends up being.
      LPMS_ALLOWED_ORIGINS: "${LPMS_CLIENT_ORIGIN:-http://localhost:5174}"
      # E-signature files (AES-256-GCM encrypted) live on their own named volume, so they survive
      # image rebuilds and `docker compose down`. The key is NOT here: it comes from the .env file
      # next to this one. An empty value means "not configured": the signature endpoints answer
      # 503 and the server still starts. Generate a key with:
      #   node -e "console.log(require('crypto').randomBytes(32).toString('base64'))"
      # Losing or changing the key makes existing signatures unreadable (users upload them again).
      LPMS_SIGNATURE_DIR: "/app/storage/signatures"
      LPMS_SIGNATURE_KEY: "${LPMS_SIGNATURE_KEY:-}"
      LPMS_SIGNATURE_KEY_VERSION: "${LPMS_SIGNATURE_KEY_VERSION:-}"
      # Outgoing mail for credentials and password-reset links. Leave LPMS_SMTP_HOST or
      # LPMS_SMTP_FROM empty and the temporary password is shown once to the superuser instead.
      LPMS_SMTP_HOST: "${LPMS_SMTP_HOST:-}"
      LPMS_SMTP_PORT: "${LPMS_SMTP_PORT:-}"
      LPMS_SMTP_USER: "${LPMS_SMTP_USER:-}"
      LPMS_SMTP_PASS: "${LPMS_SMTP_PASS:-}"
      LPMS_SMTP_FROM: "${LPMS_SMTP_FROM:-}"
      # Base URL put in emailed links; defaults to the origin the browser loads the app from.
      LPMS_APP_URL: "${LPMS_APP_URL:-${LPMS_CLIENT_ORIGIN:-http://localhost:5174}}"
    ports:
      - "${LPMS_SERVER_PORT:-5001}:5000"
    volumes:
      # A named volume, not ./server/data. WAL mode needs a shared-memory
      # sidecar next to the database file, and a sidecar written by the host's
      # own Node process cannot be reused inside a Linux container, so a bind
      # mount fails at startup with SQLITE_IOERR_SHMOPEN. The server's
      # entrypoint seeds the volume from the database in the image the first
      # time the volume is empty.
      - lpms_data:/app/data
      - lpms_signatures:/app/storage/signatures
    networks:
      - lpms_net

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      target: runtime
      args:
        # Baked into the bundle by Vite and resolved by the browser, so this is
        # the published host port of the server, not an in-network address.
        VITE_API_BASE: "${LPMS_API_BASE:-http://localhost:5001}"
    image: lpms-composition-client
    container_name: lpms-composition-client
    restart: unless-stopped
    environment:
      PORT: "5173"
    ports:
      - "${LPMS_CLIENT_PORT:-5174}:5173"
    depends_on:
      server:
        condition: service_healthy
    networks:
      - lpms_net

networks:
  lpms_net:
    driver: bridge

volumes:
  # `docker compose down -v` deletes this. The next `up --build` recreates it
  # from the database in the image, which is a copy of the worktree taken when
  # the image was last built.
  lpms_data:
  # Encrypted e-signature files. Survives `docker compose down` and rebuilds; only
  # `docker compose down -v` deletes it.
  lpms_signatures:
