version: "3.8"
services:
  mysql:
    image: mysql:8.0
    container_name: lpms-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootdevpass
      MYSQL_DATABASE: lpms_users
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql   # use named volume
      - ./mysql/init-scripts:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer
    container_name: lpms-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"

volumes:
  mysql_data:
