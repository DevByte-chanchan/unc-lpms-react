services:
  db:
    image: mysql:8.0
    container_name: lpms_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: lpms_db
      MYSQL_USER: lpms_user
      MYSQL_PASSWORD: lpms_pass
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  adminer:
    image: adminer
    container_name: lpms_adminer
    restart: always
    ports:
      - "8080:8080"

volumes:
  db_data:
